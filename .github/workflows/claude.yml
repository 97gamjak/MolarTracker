name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      github.head_ref != 'main' &&
      github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Do not check test coverage or whether unit tests were added —
            that is usually handled in a separate PR. Only one of
            CHANGELOG.md or DEV-CHANGELOG.md needs to be modified, not both.

            For every issue you find, create a task item using "- [ ]"
            instead of a plain bullet "-".

            Only review lines explicitly part of the diff (added or removed).
            Do not comment on unchanged context lines, even if they appear
            near a changed line. If only a function signature was modified,
            do not comment on the function body.

            As soon as you identify an issue, immediately call the inline
            comment tool for it. Do not wait until you have reviewed the
            entire diff before posting comments — post each finding as you
            find it, so partial progress is never lost if the review runs
            out of turns on a large PR.

            If the diff is large, prioritize core logic files (.cpp/.hpp/.tpp)
            over generated files, tests, and documentation when deciding what
            to review first.

            Always post a top-level PR comment via `gh pr comment` summarizing
            your review at the end, even if you find no issues — confirm the
            review ran and list what you checked.