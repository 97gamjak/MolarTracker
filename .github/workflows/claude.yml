name: Claude PR Review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      ${{ github.head_ref != 'main' }} &&
          github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: drillan/claude-pr-reviewer@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_model: claude-haiku-4-5-20251001
          custom_prompt: |
            Do not check test coverage or if any unit tests were added.
            This will usually be done in a separate PR. And only one of the two files: 
            CHANGELOG.md or DEV-CHANGELOG.md has to be modified. 
            Please make a todo task for every single point you find (I mean with `-[ ]` instead of `-` or something similar.
            Only review lines that are explicitly part of the diff (added or removed lines).
            Do not comment on unchanged context lines, even if they appear near a changed line.
            If only a function signature was modified, do not comment on the function body.